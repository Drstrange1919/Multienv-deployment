server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # The browser calls the frontend on port 3000. Nginx forwards these
    # requests over the private Docker network to the correct Flask service.
    location /api/dev/ {
        proxy_pass http://backend-dev:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/prod/ {
        proxy_pass http://backend-prod:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React routes such as /dev and /prod must fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
